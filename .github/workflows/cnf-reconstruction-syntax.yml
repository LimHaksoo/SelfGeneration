name: cnf-reconstruction-syntax

on:
  push:
    branches:
      - delivery/cnf-reconstruction-v1
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          python -m py_compile \
            real/eval_cnf_reconstruction.py \
            real/aggregate_cnf_reconstruction.py
      - name: Bash syntax
        run: bash -n scripts/real/run_cnf_reconstruction.sh
      - name: Build modified-files-only package
        run: |
          mkdir -p package/real package/scripts/real
          cp real/eval_cnf_reconstruction.py package/real/
          cp real/aggregate_cnf_reconstruction.py package/real/
          cp scripts/real/run_cnf_reconstruction.sh package/scripts/real/
      - uses: actions/upload-artifact@v4
        with:
          name: cnf-reconstruction-v1-modified-files-only
          path: package
          if-no-files-found: error
