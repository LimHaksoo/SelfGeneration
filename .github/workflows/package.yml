name: validate-and-package-synthetic-iron-v2

on:
  push:
    branches:
      - delivery/synthetic-iron-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile modified Python files
        run: |
          python -m py_compile \
            synthetic/iron_whitebox_common.py \
            synthetic/eval_iron_whitebox.py \
            synthetic/aggregate_iron_whitebox.py

      - name: Structural regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          common = Path('synthetic/iron_whitebox_common.py').read_text()
          evaluator = Path('synthetic/eval_iron_whitebox.py').read_text()
          aggregate = Path('synthetic/aggregate_iron_whitebox.py').read_text()

          for source in (common, evaluator, aggregate):
              ast.parse(source)

          assert 'data_dir=str(PROJECT_ROOT)' in common
          assert 'data_dir="data/hmm"' not in common
          assert 'return_diagnostics=True' in evaluator
          assert 'absolute.sum().item()' in evaluator
          assert 'delta.abs().sum().item()' in evaluator
          assert '"ce"' in evaluator and '"nce"' in evaluator
          assert '"CE_mean"' in aggregate and '"NCE_mean"' in aggregate
          assert "row['NCE_latex']" in aggregate

          # Formula regression: CE=mean(abs(r)); NCE=sum(abs(r))/sum(abs(delta)).
          sum_attr = [3.0, 1.0]
          delta = [2.0, 2.0]
          abs_error = [abs(a-d) for a, d in zip(sum_attr, delta)]
          ce = sum(abs_error) / len(abs_error)
          nce = sum(abs_error) / sum(abs(d) for d in delta)
          assert ce == 1.0
          assert nce == 0.5
          print('structural and Completeness checks passed')
          PY

      - name: Package modified files only
        run: |
          zip -r synthetic_iron_whitebox_v2_modified_files_only.zip \
            synthetic/iron_whitebox_common.py \
            synthetic/eval_iron_whitebox.py \
            synthetic/aggregate_iron_whitebox.py

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic_iron_whitebox_v2_modified_files_only
          path: synthetic_iron_whitebox_v2_modified_files_only.zip
          if-no-files-found: error
          retention-days: 7
