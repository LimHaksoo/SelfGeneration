name: package-runtime-iron

on:
  pull_request:
    paths:
      - real/benchmark_iron_runtime.py
      - scripts/real/run_iron_runtime.sh
      - agg_runtime.py
      - .github/workflows/package-runtime-iron.yml

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python syntax
        run: |
          python -m py_compile real/benchmark_iron_runtime.py agg_runtime.py
      - name: Bash syntax
        run: bash -n scripts/real/run_iron_runtime.sh
      - name: Package modified files
        uses: actions/upload-artifact@v4
        with:
          name: runtime_iron_baseline_v2_modified_files_only
          path: |
            real/benchmark_iron_runtime.py
            scripts/real/run_iron_runtime.sh
            agg_runtime.py
          if-no-files-found: error
